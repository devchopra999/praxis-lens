services:
  praxis-execution:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      PRAXIS_DATA_DIR: /data
      PRAXIS_WORKSPACES_DIR: /workspaces
      MYSQL_ROOT_PASSWORD: praxis
      AIDER_MODEL: ${AIDER_MODEL:-bedrock/anthropic.claude-3-5-sonnet-20240620-v1:0}
      AIDER_TIMEOUT_MS: ${AIDER_TIMEOUT_MS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    volumes:
      # only this service ever talks to the Docker Engine API / spawns `docker compose`
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./workspaces:/workspaces
