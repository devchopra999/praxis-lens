services:
  praxis-execution:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      PRAXIS_DATA_DIR: /data
      PRAXIS_WORKSPACES_DIR: /workspaces
      MYSQL_ROOT_PASSWORD: praxis
      AIDER_MODEL: ${AIDER_MODEL:-}
      AIDER_TIMEOUT_MS: ${AIDER_TIMEOUT_MS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # only this service ever talks to the Docker Engine API / spawns `docker compose`
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./workspaces:/workspaces
