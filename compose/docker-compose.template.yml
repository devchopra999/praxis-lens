services:
  # Always-on utility shell for every environment: Python 3 + common CLI tools, no server process
  # of its own (see toolbox-manager.js). Reached only via POST /environments/:id/execute etc.
  toolbox:
    image: praxis-toolbox:latest
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]

  # Always-on reverse proxy every other service points at instead of calling each other directly;
  # built once from the orchestrator repo and reused across environments (see orchestrator-manager.js).
  orchestrator:
    image: praxis-orchestrator:latest
    environment:
      PORT: "8000"
      ROUTES_FILE: /app/data/routes.json
    ports:
      - "0:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/healthz').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Stand-ins for the real company images: a plain alpine looping a busybox `nc` listener that
  # answers every request with "200 OK" (busybox's default alpine build has no httpd applet).
  # Override *_IMAGE to point at real images instead (real images provide their own entrypoint).
  mob:
    image: ${MOB_IMAGE:-alpine:3.19}
    # only reached by the alpine stand-in; a built-from-source image sets its own ENTRYPOINT, so
    # this becomes harmless trailing argv passed to that entrypoint instead of replacing it
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 8080; done"]
    environment:
      DB_HOST: mysql
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: mob
      # picked up by spring-petclinic's mysql profile when built from source; ignored otherwise
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql-mob/app
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD:-praxis}

  edi:
    image: ${EDI_IMAGE:-alpine:3.19}
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 8081; done"]
    environment:
      DB_HOST: mysql
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: edi


  # fintech demo services (real repos: fintech-auth/ledger/payments/notifications). Services call
  # each other directly by hostname - no gateway/proxy in front of them. DATABASE_URL points at
  # each service's own dedicated mysql-<name> container (see worker.js provisionDefaultDatabase)
  # with the db name each service's own schema.sql creates - ignored by the alpine stand-in, used
  # once built from source. JWT_SECRET must match across auth/ledger/payments.
  auth:
    image: ${AUTH_IMAGE:-alpine:3.19}
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 4000; done"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: auth
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-praxis}@mysql-auth:3306/auth_db
      JWT_SECRET: ${JWT_SECRET:-dummy-fintech-jwt-secret}

  ledger:
    image: ${LEDGER_IMAGE:-alpine:3.19}
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 4002; done"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: ledger
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-praxis}@mysql-ledger:3306/ledger_db
      JWT_SECRET: ${JWT_SECRET:-dummy-fintech-jwt-secret}
      NOTIFICATIONS_URL: http://notifications-gw.local:4004

  payments:
    image: ${PAYMENTS_IMAGE:-alpine:3.19}
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 4003; done"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: payments
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-praxis}@mysql-payments:3306/payment_db
      JWT_SECRET: ${JWT_SECRET:-dummy-fintech-jwt-secret}
      # hardcoded third-party gateway hostname (like edi's AXIS_URL) - non-colliding with any real
      # compose service name, and plain HTTP (not https), so the header injector can intercept it
      # and hand it to the orchestrator - see header-injector-manager.js FINTECH_GATEWAY_ALIASES
      PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:-http://api.nexpay.example.com}
      # renamed off the real "ledger"/"notifications" service hostnames so the header injector can
      # take over these hostnames without colliding with the real containers' own DNS aliases
      LEDGER_URL: http://ledger-gw.local:4002
      NOTIFICATIONS_URL: http://notifications-gw.local:4004

  notifications:
    image: ${NOTIFICATIONS_IMAGE:-alpine:3.19}
    command: ["sh", "-c", "while true; do printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok' | nc -l -p 4004; done"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      SERVICE_NAME: notifications
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-praxis}@mysql-notifications:3306/notification_db

